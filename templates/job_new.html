{% extends "base.html" %}
{% block title %}记一次投递{% endblock %}
{% block content %}
<div class="page-head"><h1>记一次投递</h1></div>

{% if error %}<div class="alert">{{ error }}</div>{% endif %}

<form class="form" action="/jobs/new" method="post">
  <label>公司 <input type="text" name="company" required placeholder="例如：某科技公司"></label>
  <label>岗位 <input type="text" name="position" placeholder="例如：算法工程师（可留空）"></label>
  <label>投递日期 <input type="date" name="applied" value="{{ today }}"></label>
  <label>当前状态
    <select name="status">
      {% for s in statuses %}
      <option value="{{ s }}" {% if s == "已投" %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>备注（渠道、内推人等，可留空）</label>
  <textarea name="note" rows="3" placeholder="例如：BOSS 直聘，内推人张三"></textarea>
  <button class="btn primary" type="submit">保存</button>
</form>
{% endblock %}
