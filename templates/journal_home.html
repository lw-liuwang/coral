{% extends "base.html" %}
{% block title %}随手记{% endblock %}
{% block content %}
<form class="big-editor write-page" action="/journal/write" method="post">
  <textarea name="content" id="write-area" rows="24" spellcheck="false" autofocus
            placeholder="想写点什么就写什么…&#10;时间会自动记下，一条就是一条"></textarea>
  <div class="quick-write-actions">
    <span class="hint">Ctrl+Enter 也能保存；哪怕空白，也会记下这个时刻。</span>
    <span>
      <a class="btn" href="/journal">过去的记录 →</a>
      <button class="btn primary" type="submit">保存</button>
    </span>
  </div>
</form>
{% endblock %}
