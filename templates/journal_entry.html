{% extends "base.html" %}
{% block title %}随手记 {{ date }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1><span class="entry-time big">{{ date }} {{ time }}</span></h1>
  <span class="btns">
    <a class="btn" href="/journal/{{ entry_id|urlquote }}/edit">编辑</a>
    <form class="inline" action="/journal/{{ entry_id|urlquote }}/delete" method="post"
          onsubmit="return confirmDelete('这条随手记')">
      <button class="btn danger" type="submit">删除</button>
    </form>
    <a class="btn" href="/">← 返回</a>
  </span>
</div>

{% if empty %}
<div class="empty"><p>这条只记了个时刻，没有内容。</p></div>
{% else %}
<article class="md-body">
{{ html|safe }}
</article>
{% endif %}
{% endblock %}
