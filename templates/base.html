<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}coral{% endblock %} · coral</title>
  <link rel="stylesheet" href="/static/coral.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/pygments.css">
  <link rel="stylesheet" href="/static/pygments.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🪸 coral</a>
  <nav>
    <a href="/">随手记</a>
    <a href="/kb">知识库</a>
    {% for t in nav_pins() %}
    <a class="nav-pin" href="{{ t.url }}">★ {{ t.name }}</a>
    {% endfor %}
  </nav>
  <form class="searchbox" action="/search" method="get">
    <input type="search" name="q" placeholder="搜索…" value="{{ request.query_params.get('q', '') }}">
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/coral.js?v={{ asset_ver }}"></script>
</body>
</html>
