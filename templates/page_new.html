{% extends "base.html" %}
{% block title %}新建页面{% endblock %}
{% block content %}
<div class="page-head"><h1>新建页面</h1></div>

{% if error %}
<div class="alert">{{ error }}</div>
{% endif %}

<form class="form" action="/pages/new" method="post">
  <label>标题 <input type="text" name="title" value="{{ title }}" required></label>
  <label>类型
    <select name="type">
      <option value="concept" {% if type == "concept" %}selected{% endif %}>概念 (concept)</option>
      <option value="entity" {% if type == "entity" %}selected{% endif %}>实体 (entity)</option>
      <option value="source" {% if type == "source" %}selected{% endif %}>来源 (source)</option>
    </select>
    <span class="hint">只是随手写点什么？回首页的「随手记」更省事。</span>
  </label>
  <label>正文（Markdown，可用 [[页面名]] 交叉引用）</label>
  <textarea name="content" rows="14" placeholder="# 内容…&#10;&#10;参见 [[已有页面]]"></textarea>
  <button class="btn primary" type="submit">创建</button>
</form>
{% endblock %}
