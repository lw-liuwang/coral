{% extends "base.html" %}
{% block title %}编辑 {{ slug }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>编辑 · {{ slug }}</h1>
  <span class="btns">
    <a class="btn" href="/pages/{{ slug|urlquote }}">取消</a>
    <button class="btn primary" form="edit-form" type="submit">保存</button>
  </span>
</div>

{% if error %}
<div class="alert">{{ error }}</div>
{% endif %}

<form id="edit-form" action="/pages/{{ slug|urlquote }}/edit" method="post">
  <div class="editor-grid">
    <textarea id="editor" name="content" spellcheck="false">{{ raw }}</textarea>
    <div id="preview" class="preview md-body"></div>
  </div>
</form>
{% endblock %}
